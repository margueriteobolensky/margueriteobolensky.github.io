- title: "Protect or Prepare? Crop Insurance and Adaptation in a Changing Climate"
  pdflink: "/pdf/obolensky_crop_insurance_JMP.pdf"
  note: "Winner of the 2025 Rising Star Paper Prize at the International Industrial Organization Conference"
  extranote: "Updated: April 2026"
  abstract: >
    As climate risks intensify, governments increasingly subsidize insurance against weather shocks. While these subsidies enhance short-run financial protection, 
    they may dampen incentives for long-run adaptation to climate change. This paper studies how U.S. crop insurance subsidies shape agricultural adaptation. 
    I develop and estimate a dynamic land-use model in which forward-looking farmers form beliefs about climate trends and make joint planting and insurance decisions
     under alternative subsidy regimes. Targeting subsidies toward regions with slower projected increases in climate risk partially mitigates the distortions created 
     by the status quo by improving the spatial allocation of production. However, most gains come from decoupling subsidies from actuarially fair premiums, 
     thereby restoring adaptation incentives.

- title: "Migration, Climate Similarity, and the Consequences of Climate Mismatch"
  pdflink: "https://drive.google.com/file/d/11uSqCe0v0tCWvDNjQDjqEEOngoFAt5pf/edit"
  coauthors: "Marco Tabellini and Charles Taylor"
  note: "Revise and Resubmit, Quarterly Journal of Economics"
  extranote: "Updated: October 2026"
  links:
    - url: "https://www.nber.org/papers/w32035"
      text: "NBER version"
  press_coverage:
    - title: "VoxEU"
      url: "https://cepr.org/voxeu/columns/homeward-bound-how-migrants-seek-out-familiar-climates"
  abstract: >
    This paper documents that climate similarity has shaped the geography of migration in 
    the United States for  more than 150 years, and that settling in less familiar climates 
    is associated with worse immigrant well-being. Using historical and modern data on 
    international and internal migration, we show that migrants disproportionately settle 
    in destinations whose climates resemble those of their origins. The evidence is consistent 
    with both the transferability of climate-specific skills and a direct amenity value of 
    climatic familiarity. Migrants are willing to accept greater climate mismatch in exchange
     for better economic opportunities, although climate similarity continues to shape their
      destination choices. We then document that climate mismatch is associated with lower 
      fertility, higher mortality among U.S.-born children, and shorter adult lives. The negative
       relationship between climate mismatch and longevity persists within neighborhoods and 
       becomes larger within families. The longevity association also persists into the second 
       generation, whereas the fertility and the child-mortality associations do not.

- title: "Local Crop Diversity and Pest Diffusion: Evidence from the Boll Weevil"
  extranote: "Updated: April 2026"
  pdflink: "https://emmadupuy.github.io/Crop_Diversity.pdf"
  coauthors: "Emma Du Puy"
  abstract: >
    Modern agricultural landscapes are becoming increasingly homogeneous, driven by the rise of monoculture and the pursuit of economies of scale through larger, more contiguous tracts of land. 
    The ecological consequences of this landscape simplification remain poorly quantified. We use the historical diffusion of the boll weevil across the U.S. Cotton Belt to causally link crop diversity to pest resilience. 
    By developing a harmonized dataset that links historical agricultural censuses over time and leveraging terrain ruggedness as an instrument for local crop diversity, we show that more diverse croplands significantly 
    slow pest spread. A one-standard-deviation increase in crop diversity reduces annual contamination risk by 12 percentage points, or 36 percent relative to the mean annual risk.
    This study demonstrates that enhancing crop diversity can serve as an important component of sustainable pest management.



